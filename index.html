<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Carga Celular - Área Bajo la Curva</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
 body{font-family: Arial; background:#f8f9fc; padding:20px}
 .card{background:white; padding:20px; border-radius:12px; max-width:900px; margin:auto; box-shadow:0 4px 10px #0001}
 .azul{color:#2563eb; font-weight:bold} .verde{color:#16a34a; font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>CARGA DEL CELULAR - Área bajo la curva</h2>
<p>14h totales / 2 rectángulos = <b>7h de base</b> c/u</p>
<canvas id="grafica"></canvas>
<h3>Cálculo:</h3>
<p><span class="azul">Rectángulo Azul:</span> A = b x h = 7 x 100 = 700 %·h</p>
<p><span class="verde">Rectángulo Verde:</span> A = b x h = 7 x 65 = 455 %·h</p>
<p><b>Área Total: 700 + 455 = 1155 %·h = 11.5 horas equivalentes al 100%</b></p>
</div>
<script>
const ctx = document.getElementById('grafica');
new Chart(ctx, {
  type: 'line',
  data: {
    labels: ['10AM','12M','2PM','4PM','6PM','8PM','10PM','12AM'],
    datasets: [
      { label: '% Carga', data: [100,87,85,82,70,65,50,39], borderColor:'black', tension:0.2, pointRadius:5 },
      { label: 'Rect Azul 100%', data: [100,100,100,100,null,null,null,null], backgroundColor:'rgba(37,99,235,0.4)', fill:true, stepped:true },
      { label: 'Rect Verde 65%', data: [null,null,null,null,65,65,65,65], backgroundColor:'rgba(22,163,74,0.4)', fill:true, stepped:true }
    ]
  },
  options:{ scales:{ y:{ min:0, max:100, title:{display:true, text:'% Carga'}}}}
});
</script>
</body>
</html>
